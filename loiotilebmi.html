<?php
function e($valore) {
    return htmlspecialchars((string)$valore, ENT_QUOTES, 'UTF-8');
}

$nome = trim($_POST['nome'] ?? '');
$peso = filter_input(INPUT_POST, 'peso', FILTER_VALIDATE_FLOAT);
$altezzaCm = filter_input(INPUT_POST, 'altezza', FILTER_VALIDATE_FLOAT);

if ($_SERVER['REQUEST_METHOD'] !== 'POST' || $nome === '' ||
    $peso === false || $peso === null || $peso <= 0 ||
    $altezzaCm === false || $altezzaCm === null || $altezzaCm <= 0) {
    http_response_code(400);
    $errore = 'Inserisci nome, peso e altezza validi.';
} else {
    $altezzaM = $altezzaCm / 100;
    $bmi = $peso / ($altezzaM * $altezzaM);

    if ($bmi < 18.5) {
        $classe = 'sottopeso';
        $etichetta = 'SOTTOPESO';
    } elseif ($bmi < 25) {
        $classe = 'normopeso';
        $etichetta = 'NORMOPESO';
    } elseif ($bmi < 30) {
        $classe = 'sovrappeso';
        $etichetta = 'SOVRAPPESO';
    } else {
        $classe = 'obesita';
        $etichetta = 'OBESITÀ';
    }
}
?>
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il tuo BMI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-risultato">
  <main class="risultato-wrap">
    <h1>Il tuo BMI</h1>
    <?php if (isset($errore)): ?>
      <p class="errore"><?= e($errore) ?></p>
      <a href="form.html">Torna al modulo</a>
    <?php else: ?>
      <section class="risultato-card <?= e($classe) ?>">
        <h2><?= e($nome) ?></h2>
        <p class="dati">Peso: <?= e($peso) ?> kg · Altezza: <?= e($altezzaCm) ?> cm</p>
        <p class="numero"><?= number_format($bmi, 2, '.', '') ?></p>
        <p class="etichetta"><?= e($etichetta) ?></p>
      </section>
      <a class="nuovo" href="form.html">Calcola di nuovo</a>
    <?php endif; ?>
  </main>
</body>
</html>
